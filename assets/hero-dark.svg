<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 208" width="100%" role="img" aria-label="Mahmoud Elsawy — Front-End Engineer">
  <defs>
    <pattern id="grid-dark" width="36" height="36" patternUnits="userSpaceOnUse" x="24.5" y="16.5">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#21262d" stroke-width="1" />
    </pattern>
    <radialGradient id="fade-mask-grad" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask">
      <rect width="848" height="208" fill="url(#fade-mask-grad)" />
    </mask>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Seamless GitHub Dark Canvas -->
  <rect width="848" height="208" fill="#0d1117" />
  <rect width="848" height="208" fill="url(#grid-dark)" mask="url(#grid-mask)" />

  <!-- Architectural Frame + Animated Border Beam -->
  <rect x="24.5" y="16.5" width="799" height="175" fill="none" stroke="#21262d" stroke-width="1" />
  <rect x="24.5" y="16.5" width="799" height="175" fill="none" stroke="url(#beam-grad)" stroke-width="1.2" stroke-dasharray="160 1788">
    <animate attributeName="stroke-dashoffset" from="1948" to="0" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Crosshairs (+) -->
  <g stroke="#484f58" stroke-width="1">
    <path d="M 19.5 16.5 L 29.5 16.5 M 24.5 11.5 L 24.5 21.5" />
    <path d="M 818.5 16.5 L 828.5 16.5 M 823.5 11.5 L 823.5 21.5" />
    <path d="M 19.5 191.5 L 29.5 191.5 M 24.5 186.5 L 24.5 196.5" />
    <path d="M 818.5 191.5 L 828.5 191.5 M 823.5 186.5 L 823.5 196.5" />
  </g>

  <!-- Left Editorial Column -->
  <g transform="translate(52, 42)">
    <rect x="0.5" y="0.5" width="234" height="23" rx="11.5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="none" stroke="#3fb950" stroke-width="1">
      <animate attributeName="r" values="3.5;8.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.75;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="12" r="3.2" fill="#3fb950" />
    <text x="25" y="15.5" class="mono" font-size="11" fill="#8b949e">Front-End Engineer · @neop</text>
  </g>

  <text x="52" y="106" class="sans" font-size="30" font-weight="700" fill="#f0f6fc" letter-spacing="-0.7">Mahmoud Elsawy</text>
  <text x="52" y="135" class="sans" font-size="14" fill="#8b949e">
    Designing &amp; building fast, refined web interfaces and developer tools.
  </text>
  <text x="52" y="158" class="sans" font-size="13" fill="#6e7681">
    Vue 3, Nuxt, SvelteKit, React &amp; TypeScript — focused on UI craft and motion.
  </text>

  <!-- Vertical Blueprint Divider -->
  <line x1="596.5" y1="42" x2="596.5" y2="166" stroke="#21262d" stroke-width="1" />

  <!-- Right Telemetry Column -->
  <text x="624" y="56" class="mono" font-size="10.5" fill="#6e7681" letter-spacing="1">CAIRO · EGYPT</text>

  <text x="624" y="96" class="sans" font-size="22" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">2,730+</text>
  <text x="624" y="113" class="mono" font-size="10" fill="#8b949e" letter-spacing="0.4">YEARLY CONTRIBUTIONS</text>

  <text x="624" y="146" class="sans" font-size="20" font-weight="700" fill="#f0f6fc" letter-spacing="-0.4">Production UI</text>
  <text x="624" y="163" class="mono" font-size="10" fill="#6e7681" letter-spacing="0.4">FINTECH · EDTECH · DX CLI</text>
</svg>
