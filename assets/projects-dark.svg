<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 420" width="100%" role="img" aria-label="9 Shipped Production Platforms — Neop, Neop Real Estate, SECU, Pawsket, Abajora, Masra, Nobtha, KEC, NBA">
